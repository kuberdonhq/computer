name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap and fast: lint the scripts on Linux. A full run on a macOS runner comes
  # once the repo is public, where macOS minutes are free.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x computer macos/defaults.sh
